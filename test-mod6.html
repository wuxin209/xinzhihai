<html><body><script type="module">
window.__r=null;
const res=await fetch("./assets/comp-Hx.js");
const code=await res.text();
// 去掉 function 头尾, 得到函数体
const body=code.slice(code.indexOf('{')+1, code.lastIndexOf('}'));
const n=8, seg=Math.ceil(body.length/n), bad=[];
for(let i=0;i<n;i++){
  const part=body.slice(i*seg, Math.min((i+1)*seg, body.length));
  try { new Function('K','Q','e','s', part); }
  catch(e2){ bad.push({i, msg:String(e2).slice(0,100), from:i*seg}); }
}
window.__r=JSON.stringify({len:body.length, bad});
</script></body></html>
