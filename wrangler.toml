name = "xinzhihai"
compatibility_date = "2024-09-01"

# KV 存储绑定 - 需要在Cloudflare Dashboard中创建KV namespace并绑定
# Pages项目 → 设置 → 函数 → KV命名空间绑定
# 变量名: XINZHAI_KV
#
# 环境变量:
# JWT_SECRET - JWT签名密钥（在Pages设置→环境变量中配置）
# AMAP_KEY - 高德地图API Key（可选，用于馆子安利周边搜索）

[[kv_namespaces]]
binding = "XINZHAI_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
