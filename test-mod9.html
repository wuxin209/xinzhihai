<html><body><script type="module">
window.__r={};
const res=await fetch("./assets/comp-Hx.js");
let code=await res.text();
// 测试: 函数是否以 } 结尾 / 括号平衡
window.__r.len=code.length;
window.__r.end=code.slice(-30);
// 括号平衡检查
let b=0, firstBad=-1;
for(let i=0;i<code.length;i++){
  const c=code[i];
  if(c==='('||c==='{'||c==='[') b++;
  if(c===')'||c==='}'||c===']') { b--; if(b<0){firstBad=i;break;} }
}
window.__r.balance=b; window.__r.firstBad=firstBad;
// 补全测试: 补 } 后解析
try { new Function('K','Q', code+' }'); window.__r.patched="OK"; } catch(e){ window.__r.patched="ERR:"+String(e).slice(0,60); }
// 分别测: 去掉 return 语句前 300 字符
const head=code.slice(0,300);
try { new Function('K','Q','function Hx(){'+head+'}'+'\n'+code.slice(300)); } catch(e){ window.__r.split="ERR:"+String(e).slice(0,60); } 
</script></body></html>
