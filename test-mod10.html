<html><body><script type="module">
window.__r=null;
const res=await fetch("./assets/comp-Hx.js");
let code=await res.text();
// 尾部逐步删除: 从-1到-15
const results=[];
for(let cut=1; cut<=15; cut++){
  const c=code.slice(0, code.length-cut);
  try { new Function('K','Q', c); results.push({cut, ok:true}); break; }
  catch(e){ results.push({cut, ok:false, msg:String(e).slice(0,40)}); }
}
window.__r=JSON.stringify(results.slice(0,3));
</script></body></html>
